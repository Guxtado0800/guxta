
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Segunda Chance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-color: black;
      color: white;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(90deg, #ff416c, #9932cc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    #message {
      font-size: 1.2rem;
      color: hotpink;
      margin-bottom: 1.5rem;
    }

    button {
      padding: 1rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: white;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(255, 65, 108, 0.3);
      margin-bottom: 2rem;
    }

    img {
      width: 250px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <h1>Tem certeza que me ama?</h1>
  <div id="message">VOU TE DAR MAIS UMA CHANCE</div>
  <button onclick="window.location.href='botoes.html'">EU TE AMO AMOR DA MINHA VIDA</button>
  <img src="gracinha.jpg" alt="não to pra gracinha hoje">

</body>
</html>
