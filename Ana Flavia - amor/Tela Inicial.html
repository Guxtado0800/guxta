
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dia dos Namorados</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  
    <style>
    .header-message {
      font-size: 4.5rem;
      font-family: 'Great Vibes', cursive;
      background: linear-gradient(to right, #ff758c, #ff7eb3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2rem;
    }
    
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: 'Quicksand', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(135deg, #a4508b, #5f0a87);
      color: white;
    }

    .top-message {
      position: absolute;
      top: 30px;
      font-size: 4.5rem;
      font-family: 'Great Vibes', cursive;
      background: linear-gradient(to right, #ff758c, #ff7eb3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 {
      font-size: 4.5rem;
      font-weight: 700;
      margin-top: 0;
      color: #fff0f5;
    }

    p {
      font-size: 1.2rem;
      max-width: 600px;
      margin-bottom: 2rem;
      color: #ffe3f1;
    }

    .buttons {
      display: flex;
      gap: 1rem;
    }

    button {
      padding: 1rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: white;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(255, 65, 108, 0.4);
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  
    <div class="header-message">Feliz Dia dos Namorados</div>
    

  <h1>Quer ver a nossa história?</h1>

  <p>Dependendo da sua resposta, isso pode custar caro!</p>

  <div class="buttons">
    <button onclick="window.location.href='botoes.html'">SIM</button>
    <button onclick="window.location.href='variavel do não.html'">NÃO</button>
  </div>

</body>
</html>
